[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxindex"
version = "0.1.0"
description = "Offline keyword + symbol index of a codebase for coding agents: AGENTS.md/CLAUDE.md/Copilot context files and a local MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2",
    "pathspec>=0.11",
]
keywords = ["mcp", "code-search", "claude-code", "copilot", "agents", "index"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ctxindex = "ctxindex.cli:main"

[tool.setuptools.packages.find]
include = ["ctxindex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
